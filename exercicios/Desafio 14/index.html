<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
         body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        th {
            border: 1px solid rgb(0, 0, 0);
            padding: 10px;
            background-color: gray;
        }

        td {
            border: 1px solid rgb(0, 0, 0);
            padding: 10px;
        }

        .cu {
            color: white;
        }
        
        #cu1 {
            padding-right: 190px;
        }

        #cu2 {
            padding-right: 190px;
        }

        .penis {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" class="cu">Área</th>
                <th rowspan="2" class="cu">Disciplinas</th>
                <th colspan="2" class="cu">Notas</th>
                <th rowspan="2" class="cu">Media</th>
            </tr>

            <tr>
                <th class="cu">Nota 1</th>
                <th class="cu">Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matematica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <th colspan="4" class="cu" id="cu1">Media de exatas</th>
                <td class="penis">0.0</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>Historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="4" class="cu" id="cu2">Media de humanas</th>
                <td class="penis">0.0</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
